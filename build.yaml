# This file generates the GitHub Actions build matrix.
#
# Debug configuration:
# - right half uses USB logging;
# - left half remains a normal peripheral build;
# - settings_reset is built separately.

include:
  - board: nice_nano
    shield: charybdis_left

  - board: nice_nano
    shield: charybdis_right
    snippet: zmk-usb-logging

  - board: nice_nano
    shield: settings_reset
