# This file generates the GitHub Actions build matrix.
#
# Charybdis uses nice!nano v2, which is represented by
# the nice_nano board in current ZMK/Zephyr versions.

include:
  - board: nice_nano
    shield: charybdis_left

  - board: nice_nano
    shield: charybdis_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  - board: nice_nano
    shield: settings_reset
